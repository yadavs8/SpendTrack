name: Android APK

# Builds the Kharcha Book phone app (the part that reads bank SMS) and publishes it, so installing it is one tap:
#   https://github.com/yadavs8/SpendTrack/releases/download/apk-latest/Kharcha-Book.apk
# Builds are signed with a key generated once and kept in the repo's private Actions cache (never committed: the repo
# is public), so a new APK installs over the old one and keeps its data.
on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-*']
    paths: ['app/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Signing key (created once, kept in the Actions cache)
        uses: actions/cache@v4
        with:
          path: ~/kharcha-signing
          key: kharcha-signing-v1
      - name: Prepare signing
        run: |
          mkdir -p ~/kharcha-signing
          if [ ! -f ~/kharcha-signing/release.keystore ]; then
            openssl rand -hex 16 > ~/kharcha-signing/pass.txt
            keytool -genkeypair -keystore ~/kharcha-signing/release.keystore -storepass "$(cat ~/kharcha-signing/pass.txt)" -keypass "$(cat ~/kharcha-signing/pass.txt)" -alias kharcha -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Kharcha Book personal build"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=kharcha\nkeyPassword=%s\n' "$HOME/kharcha-signing/release.keystore" "$(cat ~/kharcha-signing/pass.txt)" "$(cat ~/kharcha-signing/pass.txt)" > keystore.properties
      - name: Unit tests
        run: ./gradlew :app:testSideloadDebugUnitTest --no-daemon --stacktrace
      - name: Build APK
        run: ./gradlew :app:assembleSideloadDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk -name '*.apk' | head -n 1)" out/Kharcha-Book.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kharcha-Book-apk
          path: out/Kharcha-Book.apk
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/Kharcha-Book.apk --title "Kharcha Book (Android)" --notes "Latest Android build from main (commit ${GITHUB_SHA::7}). Open this page on your phone, tap Kharcha-Book.apk, install." --latest=false
