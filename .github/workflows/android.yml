name: Android APK

# Builds the Kharcha Book phone app (the part that reads bank SMS) and publishes it, so installing it is one tap:
#   https://github.com/yadavs8/SpendTrack/releases/download/apk-latest/Kharcha-Book.apk
#
# Safety (audit M1/M2, .rea/audit.md):
# - The published APK is a RELEASE build (not debuggable: no `adb run-as` into the app's data, no WebView remote
#   debugging). Same app id and signing key, so it installs over the old one and keeps its data.
# - The signing key (kept in the repo's private Actions cache — never committed: the repo is public) is only
#   touched by runs on `main`. Branch builds compile and run the tests but are not signed with it.
# - Only the publish job, on `main`, may write to the repo (the release); everything else is read-only.
# - The release is updated in place (assets replaced), so the download link never 404s mid-update.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # daily: keeps the signing key in the Actions cache well inside its 7-days-unused expiry
  push:
    branches: [main, 'ccr-*']
    paths: ['app/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Signing key (main only; created once, kept in the Actions cache)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: ~/kharcha-signing
          key: kharcha-signing-v1
      - name: Prepare signing (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/kharcha-signing
          if [ ! -f ~/kharcha-signing/release.keystore ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && gh release view apk-latest >/dev/null 2>&1; then
            # A new key would make the next APK refuse to install over the one people already have.
            # Stop instead, so it is noticed; a deliberate new key needs a manual run (Actions > Android APK > Run workflow).
            echo "::error::Signing key missing from the cache. Not making a new one silently; start this workflow by hand to create a new key."
            exit 1
          fi
          if [ ! -f ~/kharcha-signing/release.keystore ]; then
            openssl rand -hex 16 > ~/kharcha-signing/pass.txt
            keytool -genkeypair -keystore ~/kharcha-signing/release.keystore -storepass "$(cat ~/kharcha-signing/pass.txt)" -keypass "$(cat ~/kharcha-signing/pass.txt)" -alias kharcha -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Kharcha Book personal build"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=kharcha\nkeyPassword=%s\n' "$HOME/kharcha-signing/release.keystore" "$(cat ~/kharcha-signing/pass.txt)" "$(cat ~/kharcha-signing/pass.txt)" > keystore.properties
      - name: Unit tests
        run: bash ./gradlew :app:testSideloadReleaseUnitTest --no-daemon --stacktrace
      - name: Build APK (release, not debuggable)
        run: bash ./gradlew :app:assembleSideloadRelease -PkharchaVersionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk -name '*.apk' | head -n 1)" out/Kharcha-Book.apk
          (cd out && zip -q Kharcha-Book.zip Kharcha-Book.apk)
          rm -f keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: Kharcha-Book-apk
          path: out/

  publish:
    # Only a push to main or a manual run on main publishes (not the daily cache-keeping run, not branches).
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kharcha-Book-apk
          path: out
      - name: Publish release (replace the files in place)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Latest Android build from main (commit ${GITHUB_SHA::7}). Open this page on your phone, tap Kharcha-Book.apk, install."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest out/Kharcha-Book.apk out/Kharcha-Book.zip --clobber
            gh release edit apk-latest --notes "$notes"
          else
            gh release create apk-latest out/Kharcha-Book.apk out/Kharcha-Book.zip --title "Kharcha Book (Android)" --notes "$notes" --latest=false --target "$GITHUB_SHA"
          fi
