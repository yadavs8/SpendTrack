  <g stroke="#9CC4D1" stroke-width="12" stroke-linecap="round" opacity=".75">
    <line x1="52" y1="250" x2="118" y2="250"/>
    <line x1="72" y1="294" x2="128" y2="294"/>
    <line x1="60" y1="338" x2="112" y2="338"/>
  </g>
  <!-- flying coins -->
  <g fill="#F2B84B">
    <circle cx="396" cy="108" r="30"/>
    <circle cx="458" cy="186" r="20"/>
    <circle cx="120" cy="150" r="18"/>
