    <rect x="162" y="238" width="188" height="102" rx="9" fill="none" stroke="#2E8B57" stroke-width="5"/>
    <circle cx="256" cy="289" r="38" fill="#2E8B57"/>
    <text x="256" y="311" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700" font-size="60" fill="#E8F4EA">₹</text>
    <circle cx="188" cy="262" r="8" fill="#2E8B57"/><circle cx="324" cy="316" r="8" fill="#2E8B57"/>
  </g>
