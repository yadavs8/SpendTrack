    <text x="458" y="199" font-size="24">₹</text>
  </g>
  <!-- wings -->
  <g fill="#FFFFFF">
    <path d="M168 286 C120 270 96 214 112 170 C146 188 176 214 196 252 Z"/>
    <path d="M168 300 C112 304 82 262 84 226 C124 226 160 246 192 276 Z" opacity=".85"/>
    <path d="M344 286 C392 270 416 214 400 170 C366 188 336 214 316 252 Z"/>
    <path d="M344 300 C400 304 430 262 428 226 C388 226 352 246 320 276 Z" opacity=".85"/>
  </g>
