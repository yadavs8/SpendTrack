<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha Book — Shared Trip</title>
<meta name="description" content="View and add to a shared trip's spending, no account needed.">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=99">
<meta name="theme-color" content="#0284C7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg:#F7F9FA; --surface:#fff; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --accent:#0284C7; --accent-soft:rgba(2,132,199,.1); --danger:#DC2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0B1120; --surface:#131B2E; --ink:#F1F5F9; --muted:#8A97AC; --line:#1F2A40; --accent:#38BDF8; --accent-soft:rgba(56,189,248,.14); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.45 -apple-system,system-ui,"IBM Plex Sans",sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 48px; min-height:100vh; }
  h1 { font-size:1.3rem; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:0.85rem; margin:0 0 20px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .total { font:700 2rem/1.1 inherit; margin:0; }
  .total-note { color:var(--muted); font-size:0.82rem; margin:4px 0 0; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  label { font-size:0.8rem; color:var(--muted); }
  input { font:inherit; font-size:1rem; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); width:100%; }
  input:focus { outline:none; border-color:var(--accent); }
  button { font:inherit; font-weight:600; font-size:0.95rem; padding:11px 16px; border-radius:10px; border:0; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; width:100%; }
  .primary:disabled { opacity:.5; cursor:default; }
  .err { color:var(--danger); font-size:0.85rem; margin:6px 0 0; }
  .list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; padding-bottom:0; }
  .row-l { display:flex; flex-direction:column; gap:1px; }
  .row-desc { font-weight:600; }
  .row-meta { font-size:0.76rem; color:var(--muted); }
  .row-amt { font-weight:700; white-space:nowrap; }
  .empty { color:var(--muted); font-size:0.88rem; text-align:center; padding:18px 0; }
  .center { text-align:center; padding:60px 16px; color:var(--muted); }
  .brand { font-size:0.75rem; color:var(--muted); text-align:center; margin-top:24px; }
  .brand a { color:var(--accent); text-decoration:none; }
  .install-row { display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .install-row p { margin:0; font-size:0.82rem; color:var(--muted); flex:1; }
  .ghost { background:var(--accent-soft); color:var(--accent); flex:none; padding:9px 14px; font-size:0.85rem; }
  /* "Get the trip app" banner, under the trip header */
  .install-banner { border-color:var(--accent); background:linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 70%); }
  .install-title { font-weight:700; font-size:1.02rem; margin:0 0 4px; }
  .install-sub { color:var(--muted); font-size:0.84rem; margin:0 0 12px; }
  .install-actions { display:flex; gap:8px; }
  .install-actions .primary { flex:1; width:auto; }
  .install-actions .btn-secondary { flex:none; }
  /* Full-bleed hero: breaks out of .wrap's side/top padding via negative margins, so it reaches
     the screen edges on a phone instead of sitting inside the padded column like everything else. */
  .hero { position:relative; height:190px; overflow:hidden; margin:-20px -16px 18px; color:#fff; }
  .hero-art { position:absolute; inset:0; }
  .hero-art svg { width:100%; height:100%; display:block; }
  .hero-shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.6) 100%); }
  .hero-inner { position:relative; z-index:2; height:100%; padding:18px 20px; display:flex; flex-direction:column; justify-content:flex-end; }
  .hero-tag { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; opacity:.92; }
  .hero-title { font:700 1.6rem/1.22 inherit; margin:4px 0 0; text-shadow:0 1px 6px rgba(0,0,0,.45); }
  .hero-sub { font-size:0.83rem; opacity:.88; margin:5px 0 0; }

  /* Splitwise-style Settlement Cards */
  .settle-hero { border-radius:12px; padding:14px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px; }
  .settle-owe { background:#FEF2F2; border:1px solid #FCA5A5; color:#991B1B; }
  .settle-owed { background:#F0FDF4; border:1px solid #86EFAC; color:#166534; }
  .settle-even { background:var(--surface); border:1px solid var(--line); color:var(--muted); }
  @media (prefers-color-scheme: dark) {
    .settle-owe { background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.3); color:#FCA5A5; }
    .settle-owed { background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.3); color:#86EFAC; }
    .settle-even { background:var(--surface); border-color:var(--line); color:var(--muted); }
  }
  .settle-headline { font-weight:700; font-size:1.15rem; margin:0; }
  .settle-sub { font-size:0.85rem; margin:0; opacity:.9; }
  .settle-actions { display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .btn-upi { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:linear-gradient(135deg, #0284C7 0%, #0369A1 100%); color:#fff; font-weight:700; font-size:0.92rem; padding:10px 16px; border-radius:10px; border:0; cursor:pointer; text-decoration:none; box-shadow:0 2px 6px rgba(2,132,199,.25); }
  .btn-upi:active { transform:scale(0.98); }
  .btn-wa { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:#25D366; color:#fff; font-weight:700; font-size:0.88rem; padding:8px 14px; border-radius:10px; border:0; cursor:pointer; text-decoration:none; }
  .btn-wa:active { transform:scale(0.98); }
  .btn-ghost-sm { background:var(--accent-soft); color:var(--accent); padding:6px 10px; font-size:0.78rem; border-radius:8px; border:0; cursor:pointer; font-weight:600; text-decoration:none; }

  .transfer-item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .transfer-item:last-child { border-bottom:0; padding-bottom:0; }
  .transfer-who { font-weight:600; font-size:0.92rem; }
  .transfer-arrow { color:var(--muted); font-size:0.85rem; padding:0 3px; }
  .transfer-amt { font-weight:700; font-size:1rem; white-space:nowrap; }

  .person-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .person-row:last-child { border-bottom:0; }
  .person-info { display:flex; flex-direction:column; gap:2px; }
  .person-name { font-weight:600; font-size:0.92rem; }
  .person-meta { font-size:0.78rem; color:var(--muted); }
  .person-status { font-weight:700; font-size:0.85rem; padding:3px 8px; border-radius:6px; white-space:nowrap; }
  .status-pos { background:rgba(34,197,94,.12); color:#166534; }
  .status-neg { background:rgba(239,68,68,.12); color:#991B1B; }
  .status-zero { background:var(--line); color:var(--muted); }
  @media (prefers-color-scheme: dark) {
    .status-pos { color:#86EFAC; }
    .status-neg { color:#FCA5A5; }
  }

  .chip-box { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { padding:6px 12px; border-radius:20px; font-size:0.82rem; font-weight:600; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; user-select:none; }
  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row-del { background:none; border:none; color:var(--muted); font-size:0.95rem; cursor:pointer; padding:4px 6px; border-radius:6px; margin-left:4px; }
  .row-del:hover { color:var(--danger); background:rgba(220,38,38,.08); }
  .tag-split { font-size:0.7rem; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:2px 6px; border-radius:4px; margin-top:2px; display:inline-block; }

  /* UPI Payment Modal */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .modal-box { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; width:100%; max-width:400px; box-shadow:0 12px 32px rgba(0,0,0,0.18); display:flex; flex-direction:column; gap:14px; animation:modalPop 0.2s cubic-bezier(0.16,1,0.3,1); }
  @keyframes modalPop { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
  .modal-title { font-weight:700; font-size:1.2rem; margin:0; }
  .modal-sub { color:var(--muted); font-size:0.88rem; margin:-4px 0 0; }
  .modal-btn-row { display:flex; gap:8px; margin-top:4px; }
  .btn-secondary { background:var(--bg); border:1px solid var(--line); color:var(--ink); padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600; flex:1; text-align:center; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="center" id="loading">Loading trip…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=105" onerror="void 0"></script>
<script src="ledger-logic.js?v=105"></script>
<script src="trip.js?v=105"></script>
</body>
</html>
